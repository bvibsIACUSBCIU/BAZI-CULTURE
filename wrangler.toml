name = "liangyi-bazi-api"
main = "src/worker.js"
compatibility_date = "2026-08-08"
workers_dev = true

[vars]
ENVIRONMENT = "development"
SESSION_TTL_SECONDS = "21600"
SESSION_COOKIE_NAME = "liangyi_session"
ALLOWED_ORIGIN = "http://127.0.0.1:4173"

[[d1_databases]]
binding = "DB"
database_name = "liangyi-bazi-local"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "AUTH_KV"
id = "00000000000000000000000000000000"

[env.preview]
name = "liangyi-bazi-api-preview"

[env.preview.vars]
ENVIRONMENT = "preview"
SESSION_TTL_SECONDS = "21600"
SESSION_COOKIE_NAME = "liangyi_session"
ALLOWED_ORIGIN = "https://preview.example.invalid"

[env.production]
name = "liangyi-bazi-api"

[env.production.vars]
ENVIRONMENT = "production"
SESSION_TTL_SECONDS = "21600"
SESSION_COOKIE_NAME = "liangyi_session"
ALLOWED_ORIGIN = "https://example.invalid"
